name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: [v4]
  workflow_dispatch:

concurrency: 
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false  # Changed to false for stability

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          retries: 3
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5
        
      - name: Build Quartz
        run: npx quartz build
        timeout-minutes: 5
        
      - name: Verify Build Output
        run: |
          ls -la public/
          test -f public/index.html || exit 1
          echo "Build verification passed"
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
          retention-days: 1
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 3